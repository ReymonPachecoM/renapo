<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Personas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Sistema de Personas</h1>
        
        <!-- Buscar por CURP -->
        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                <h3>Buscar Persona</h3>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="input-curp" class="form-control" placeholder="Ingresa la CURP">
                    <button class="btn btn-success" onclick="buscarPersona()">Buscar</button>
                </div>
                <div id="resultado-busqueda" class="mt-3"></div>
            </div>
        </div>

        <!-- Registrar nueva persona -->
        <div class="card mt-4">
            <div class="card-header bg-info text-white">
                <h3>Registrar Nueva Persona</h3>
            </div>
            <div class="card-body">
                <form id="form-persona">
                    <div class="mb-3">
                        <label for="curp" class="form-label">CURP</label>
                        <input type="text" class="form-control" id="curp" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" >
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+">
                    </div>
                    <div class="mb-3">
                      <label for="estado" class="form-label">Estado</label>
                      <input type="text" class="form-control" id="estado" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" >
                  </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
